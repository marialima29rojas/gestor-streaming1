<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Editar' if edit else 'Vincular' }} Perfil - {{ nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/' + nombre.lower() + '.png') }}">
    <style>
        @media (max-width: 576px) {
        .card-custom {
            padding: 1.5rem;
            margin: 10px;
            border-radius: 16px;
        }
        .row-grid {
            grid-template-columns: 1fr; /* Una columna en móvil para PIN y Vencimiento */
        }
        .header-section h2 {
            font-size: 1.5rem;
        }
    }


        body { 
            background-color: #0f0f10; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            display: flex; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            margin: 0;
        }
        .card-custom { 
            background: #1a1a1c; 
            border: 1px solid #2d2d2f; 
            border-radius: 24px; 
            padding: 2.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            width: 100%; 
            max-width: 500px;
        }
        .header-section {
            margin-bottom: 2rem;
            text-align: center;
        }
        .platform-badge {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-label { 
            color: #a0a0a5; 
            font-size: 0.85rem; 
            font-weight: 600; 
            margin-bottom: 0.6rem;
            display: block;
        }
        .form-control, .form-select { 
            background: #262629 !important; 
            border: 1.5px solid #363639 !important; 
            color: white !important; 
            border-radius: 12px; 
            padding: 0.8rem 1rem; 
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #ffc107 !important;
            box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.15) !important;
            outline: none;
        }
        .input-group-container {
            margin-bottom: 1.25rem;
        }
        .row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-save { 
            background: #ffc107; 
            border: none; 
            padding: 0.9rem; 
            border-radius: 12px; 
            font-weight: 700; 
            color: #000; 
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        .btn-save:hover { 
            background: #ffca2c; 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(255, 193, 7, 0.4);
        }
        .btn-cancel {
            color: #808080;
            text-decoration: none;
            font-size: 0.9rem;
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            transition: color 0.2s;
        }
        .btn-cancel:hover { color: #ffffff; }
    </style>
</head>
<body>
    <div class="card-custom">
        <div class="header-section">
            <span class="platform-badge">{{ nombre }}</span>
            <h2 class="mt-2 fw-bold">{{ 'Editar' if edit else 'Vincular' }} Perfil</h2>
            <p class="text-secondary small">Asigna un cliente a una cuenta maestra.</p>
        </div>
        
        <form action="/agregar_perfil" method="POST">
            <input type="hidden" name="plat_nombre" value="{{ nombre }}">
            {% if edit %}
            <input type="hidden" name="id" value="{{ perfil[0] }}">
            {% endif %}
            
            <div class="input-group-container">
                <label class="form-label">Seleccionar Cuenta Maestra</label>
                <select name="id_cuenta" class="form-select" required>
                    <option value="" disabled {{ 'selected' if not edit and not id_seleccionada else '' }}>Elige una cuenta...</option>
                    {% for c in cuentas %}
                    <option value="{{ c[0] }}" 
                        {% if edit and perfil[4]|int == c[0]|int %}
                            selected
                        {% elif id_seleccionada and id_seleccionada|int == c[0]|int %}
                            selected
                        {% endif %}>
                        {{ c[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="input-group-container">
                <label class="form-label">Nombre del Cliente / Perfil</label>
                <input type="text" name="nombre" class="form-control" 
                       value="{{ perfil[1] if edit else '' }}" 
                       placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="row-grid">
                <div class="input-group-container">
                    <label class="form-label">PIN</label>
                    <input type="text" name="pin" class="form-control" 
                           value="{{ perfil[2] if edit else '' }}" 
                           placeholder="1234">
                </div>
                <div class="input-group-container">
                    <label class="form-label">Vencimiento</label>
                    <input type="date" name="vencimiento" class="form-control" 
                           value="{{ perfil[5] if edit else '' }}" required>
                </div>
            </div>
            
            <div class="input-group-container">
                <label class="form-label">Contacto (WhatsApp)</label>
                <input type="text" name="contacto" class="form-control" 
                       value="{{ perfil[3] if edit else '' }}" 
                       placeholder="Ej: 34600000000">
            </div>
            
            <button type="submit" class="btn btn-save">
                {{ 'ACTUALIZAR PERFIL' if edit else 'VINCULAR AHORA' }}
            </button>
            
            <a href="/plataforma/{{ nombre }}" class="btn btn-cancel">Cancelar y volver</a>
        </form>
    </div>
</body>
</html>
