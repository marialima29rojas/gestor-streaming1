<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Manager Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0b0b0b; color: #e5e5e5; }
        .navbar { background: #000; border-bottom: 3px solid #E50914; padding: 15px; }
        .card-cuenta { background: #181818; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; padding: 20px; }
        .btn-netflix { background: #E50914; color: white; font-weight: bold; border: none; }
        .btn-netflix:hover { background: #b20710; color: white; }
        /* OCULTAR FORMULARIOS POR DEFECTO PARA QUE NO SE VEA DESORDENADO */
        .modal { color: #000; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand fw-bold text-danger">STREAMING MANAGER</span>
        <button class="btn btn-netflix btn-sm" data-bs-toggle="modal" data-bs-target="#modalCuenta">+ NUEVA CUENTA</button>
    </div>
</nav>

<div class="container">
    <div class="row">
        {% for c in cuentas %}
        <div class="col-md-4">
            <div class="card-cuenta text-center">
                <h3 class="text-white border-bottom pb-2">{{ c.plataforma.upper() }}</h3>
                <p class="mb-1 text-secondary">Correo: <span class="text-info">{{ c.correo }}</span></p>
                <p class="mb-3 text-secondary">Clave: <span class="text-white">{{ c.password }}</span></p>
                
                <div class="bg-dark p-2 rounded mb-3 text-start small">
                    {% for p in c.perfiles %}
                    <div class="border-bottom border-secondary py-1 text-secondary">
                        👤 {{ p[0] }} | PIN: <b>{{ p[1] or 'X' }}</b>
                    </div>
                    {% endfor %}
                </div>

                <button class="btn btn-outline-light btn-sm w-100 mb-2" onclick="abrirModalPerfil('{{ c.id }}', '{{ c.plataforma }}')">+ Perfil</button>
                <a href="/eliminar_cuenta/{{ c.id }}" class="btn btn-outline-danger btn-sm w-100" onclick="return confirm('¿Borrar?')">Eliminar</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="modal fade" id="modalCuenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content"><form action="/agregar_cuenta" method="POST">
        <div class="modal-body">
            <input type="text" name="plataforma" class="form-control mb-2" placeholder="Plataforma" required>
            <input type="email" name="correo" class="form-control mb-2" placeholder="Correo" required>
            <input type="text" name="password" class="form-control mb-2" placeholder="Contraseña" required>
            <input type="date" name="vencimiento" class="form-control" required>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-netflix w-100">GUARDAR</button></div>
    </form></div></div>
</div>

<div class="modal fade" id="modalPerfil" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content"><form action="/agregar_perfil" method="POST">
        <input type="hidden" name="id_cuenta" id="id_cuenta_input">
        <div class="modal-body text-center">
            <h6>Añadir perfil a <span id="nombre_plat" class="text-danger"></span></h6>
            <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre Usuario" required>
            <input type="text" name="pin" class="form-control mb-2" placeholder="PIN">
            <input type="text" name="contacto" class="form-control mb-2" placeholder="Contacto">
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary w-100">AÑADIR</button></div>
    </form></div></div>
</div>

<script>
    function abrirModalPerfil(id, plataforma) {
        document.getElementById('id_cuenta_input').value = id;
        document.getElementById('nombre_plat').innerText = plataforma;
        new bootstrap.Modal(document.getElementById('modalPerfil')).show();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
