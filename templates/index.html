<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Manager Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: #e5e5e5; font-family: sans-serif; }
        .navbar { background: #000; border-bottom: 3px solid #E50914; padding: 15px; }
        .card-cuenta { background: #181818; border-radius: 10px; border: 1px solid #333; padding: 20px; margin-bottom: 20px; }
        .btn-netflix { background: #E50914; color: white; fw-bold; border: none; border-radius: 4px; padding: 8px 16px; text-decoration: none; }
        .modal-content { background: #181818; border: 1px solid #E50914; color: white; }
        .form-control { background: #333; border: none; color: white; margin-bottom: 10px; }
    </style>
</head>
<body>

<nav class="navbar mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <span style="color: #E50914; font-weight: bold; font-size: 1.5rem;">STREAMING MANAGER</span>
        <button class="btn-netflix" data-bs-toggle="modal" data-bs-target="#modalCuenta">+ NUEVA CUENTA</button>
    </div>
</nav>

<div class="container">
    <div class="row">
        {% for c in cuentas %}
        <div class="col-md-4">
            <div class="card-cuenta text-center">
                <h2 style="color: white; border-bottom: 1px solid #333; padding-bottom: 10px;">{{ c.plataforma.upper() }}</h2>
                <p style="color: #aaa; margin-top: 15px;">Usuario: <b style="color: #00d4ff;">{{ c.correo }}</b></p>
                <p style="color: #aaa;">Clave: <b style="color: white;">{{ c.password }}</b></p>
                
                <div style="background: #000; padding: 10px; border-radius: 5px; margin: 15px 0; text-align: left; font-size: 0.9rem;">
                    {% for p in c.perfiles %}
                    <div style="border-bottom: 1px solid #222; padding: 5px 0; color: #888;">
                        👤 {{ p[0] }} | PIN: <span style="color: white;">{{ p[1] or 'S/N' }}</span>
                    </div>
                    {% endfor %}
                </div>

                <button class="btn btn-outline-light btn-sm w-100 mb-2" onclick="abrirModalPerfil('{{ c.id }}', '{{ c.plataforma }}')">+ Añadir Perfil</button>
                <a href="/eliminar_cuenta/{{ c.id }}" class="btn btn-outline-danger btn-sm w-100" onclick="return confirm('¿Eliminar cuenta?')">Eliminar Todo</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="modal fade" id="modalCuenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/agregar_cuenta" method="POST" class="p-4">
                <h5>Registrar Cuenta</h5>
                <input type="text" name="plataforma" class="form-control" placeholder="Plataforma" required>
                <input type="email" name="correo" class="form-control" placeholder="Correo" required>
                <input type="text" name="password" class="form-control" placeholder="Contraseña" required>
                <input type="date" name="vencimiento" class="form-control" required>
                <button type="submit" class="btn-netflix w-100 mt-2">GUARDAR</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPerfil" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="/agregar_perfil" method="POST" class="p-4">
                <input type="hidden" name="id_cuenta" id="id_input">
                <h5>Añadir perfil a <span id="span_plat" style="color: #E50914;"></span></h5>
                <input type="text" name="nombre" class="form-control" placeholder="Nombre del perfil" required>
                <input type="text" name="pin" class="form-control" placeholder="PIN">
                <input type="text" name="contacto" class="form-control" placeholder="Contacto (Opcional)">
                <button type="submit" class="btn btn-primary w-100 mt-2">AÑADIR</button>
            </form>
        </div>
    </div>
</div>

<script>
    function abrirModalPerfil(id, plat) {
        document.getElementById('id_input').value = id;
        document.getElementById('span_plat').innerText = plat;
        var myModal = new bootstrap.Modal(document.getElementById('modalPerfil'));
        myModal.show();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
