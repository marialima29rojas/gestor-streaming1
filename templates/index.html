<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0b0b0b; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        .navbar { background: rgba(0,0,0,0.9); border-bottom: 2px solid #E50914; backdrop-filter: blur(10px); }
        .card-cuenta { 
            background: #181818; border-radius: 12px; border: 1px solid #333;
            transition: all 0.3s ease; overflow: hidden;
        }
        .card-cuenta:hover { border-color: #E50914; transform: translateY(-5px); }
        .header-card { background: #222; padding: 15px; border-bottom: 1px solid #333; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .vence-rojo { background: #7c1212; color: #ffb4b4; }
        .vence-amarillo { background: #7c6212; color: #ffefb4; }
        .vence-verde { background: #127c12; color: #b4ffb4; }
        .btn-netflix { background: #E50914; color: white; font-weight: bold; border: none; }
        .btn-netflix:hover { background: #b20710; color: white; }
        .table { --bs-table-bg: transparent; color: #ccc; border-color: #333; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top px-4 mb-4">
    <span class="navbar-brand fw-bold"><i class="bi bi-clapperboard-fill text-danger me-2"></i>STREAMING MANAGER</span>
    <button class="btn btn-netflix btn-sm" data-bs-toggle="modal" data-bs-target="#modalCuenta">+ NUEVA CUENTA</button>
</nav>

<div class="container">
    <div class="row g-4">
        {% for c in cuentas %}
        <div class="col-md-6 col-lg-4">
            <div class="card card-cuenta h-100">
                <div class="header-card d-flex justify-content-between align-items-center">
                    <h5 class="m-0 text-white fw-bold">{{ c.plataforma.upper() }}</h5>
                    <span class="status-badge {% if c.dias <= 0 %}vence-rojo{% elif c.dias <= 5 %}vence-amarillo{% else %}vence-verde{% endif %}">
                        {{ c.dias }} días
                    </span>
                </div>
                <div class="p-3">
                    <p class="small text-secondary mb-1">Correo: <span class="text-info">{{ c.correo }}</span></p>
                    <p class="small text-secondary">Clave: <span class="text-white fw-bold">{{ c.password }}</span></p>
                    
                    <hr class="border-secondary">
                    
                    <table class="table table-sm align-middle mb-3">
                        <thead><tr class="small text-secondary"><th>Perfil</th><th>PIN</th><th>Contacto</th></tr></thead>
                        <tbody>
                            {% for p in c.perfiles %}
                            <tr>
                                <td class="small">{{ p[0] }}</td>
                                <td><span class="badge bg-dark border border-secondary">{{ p[1] or '-' }}</span></td>
                                <td class="small text-secondary">{{ p[2] or '-' }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    
                    <div class="d-flex justify-content-between">
                        <button class="btn btn-sm btn-outline-light" onclick="abrirModalPerfil('{{ c.id }}', '{{ c.plataforma }}')">
                            <i class="bi bi-person-plus"></i> Perfil
                        </button>
                        <a href="/eliminar_cuenta/{{ c.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Seguro que quieres borrar toda la cuenta?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="modal fade" id="modalCuenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content bg-dark border-secondary">
        <form action="/agregar_cuenta" method="POST">
            <div class="modal-body p-4">
                <h5 class="mb-3">Registrar Cuenta</h5>
                <input type="text" name="plataforma" class="form-control bg-dark text-white mb-2" placeholder="Ej: Netflix" required>
                <input type="email" name="correo" class="form-control bg-dark text-white mb-2" placeholder="Correo de acceso" required>
                <input type="text" name="password" class="form-control bg-dark text-white mb-2" placeholder="Contraseña" required>
                <label class="small text-secondary mb-1">Fecha de Vencimiento:</label>
                <input type="date" name="vencimiento" class="form-control bg-dark text-white mb-2">
            </div>
            <div class="p-3 pt-0"><button type="submit" class="btn btn-netflix w-100">GUARDAR CUENTA</button></div>
        </form>
    </div></div>
</div>

<div class="modal fade" id="modalPerfil" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm"><div class="modal-content bg-dark border-secondary">
        <form action="/agregar_perfil" method="POST">
            <input type="hidden" name="id_cuenta" id="input_id_cuenta">
            <div class="modal-body p-4">
                <h6 class="mb-3 text-center">Añadir perfil a <span id="nombre_plat" class="text-danger"></span></h6>
                <input type="text" name="nombre" class="form-control bg-dark text-white mb-2" placeholder="Nombre Usuario" required>
                <input type="text" name="pin" class="form-control bg-dark text-white mb-2" placeholder="PIN">
                <input type="text" name="contacto" class="form-control bg-dark text-white mb-2" placeholder="Teléfono / Contacto">
            </div>
            <div class="p-3 pt-0"><button type="submit" class="btn btn-primary w-100 btn-sm">GUARDAR PERFIL</button></div>
        </form>
    </div></div>
</div>

<script>
    function abrirModalPerfil(id, plataforma) {
        document.getElementById('input_id_cuenta').value = id;
        document.getElementById('nombre_plat').innerText = plataforma;
        new bootstrap.Modal(document.getElementById('modalPerfil')).show();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
