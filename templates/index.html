<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f0f10;
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-title {
            font-weight: 800;
            margin-bottom: 3rem;
            text-align: center;
            letter-spacing: -1px;
        }

        .platform-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .platform-card {
            background: #1a1a1c;
            border: 1px solid #2d2d30;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Contenedor para que todos los logos midan lo mismo */
        .logo-container {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Esto evita que el logo se deforme */
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        .platform-card:hover {
            transform: translateY(-10px);
            border-color: #ffc107;
            background: #252528;
        }

        .platform-card:hover img {
            transform: scale(1.1);
            transition: 0.3s;
        }

        @media (max-width: 992px) {
            .platform-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 600px;
            }
        }

        @media (max-width: 576px) {
            .platform-grid {
                grid-template-columns: 1fr;
            }
            .platform-card {
                flex-direction: row;
                justify-content: flex-start;
                padding-left: 30px;
            }
            .logo-container {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <h1 class="main-title">GESTIÓN DE <span style="color: #ffc107;">STREAMING</span></h1>

    <div class="platform-grid">
        <a href="/plataforma/Netflix" class="platform-card">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/netflix.png') }}" alt="Netflix">
            </div>
            <span class="fw-bold">NETFLIX</span>
        </a>

        <a href="/plataforma/Disney" class="platform-card">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/disney.png') }}" alt="Disney+">
            </div>
            <span class="fw-bold">DISNEY+</span>
        </a>

        <a href="/plataforma/HBO" class="platform-card">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/hbo.png') }}" alt="HBO Max">
            </div>
            <span class="fw-bold">HBO MAX</span>
        </a>

        <a href="/plataforma/Prime" class="platform-card">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/prime.png') }}" alt="Prime Video">
            </div>
            <span class="fw-bold">PRIME VIDEO</span>
        </a>
    </div>

</body>
</html>
